services:
  postgres:
    image: postgres:17.5-alpine
    shm_size: 256m
    environment:
      POSTGRES_DB: wow_dashboard_api
      POSTGRES_USER: wow_dashboard
      POSTGRES_PASSWORD: wow_dashboard
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wow_dashboard -d wow_dashboard_api"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - wow-dashboard-api-postgres-data:/var/lib/postgresql/data

  # Optional: shared store for distributed auth rate limiting. Set
  # REDIS_URL=redis://localhost:6379/0 to use it; without REDIS_URL the API
  # falls back to the per-instance in-memory limiter.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  # Mailpit catches outbound SMTP in development. The API/worker talk to
  # localhost:1025 with TLS=none, and the web UI at http://localhost:8025
  # shows every captured message. Production must point at a real relay.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  wow-dashboard-api-postgres-data:
