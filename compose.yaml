services:
  postgres:
    image: postgres:17-alpine
    shm_size: 256m
    environment:
      POSTGRES_DB: wow_dashboard_api
      POSTGRES_USER: spec
      POSTGRES_PASSWORD: spec
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spec -d wow_dashboard_api"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - wow-dashboard-api-postgres-data:/var/lib/postgresql/data

volumes:
  wow-dashboard-api-postgres-data:
