# Dependabot keeps the Go module and the GitHub Actions workflows fresh on
# a monthly cadence so the PR feed stays quiet. Security advisories still
# open individual PRs immediately, so a real CVE never waits on the schedule.

version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      go-deps:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      time: "07:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope
